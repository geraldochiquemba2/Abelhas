name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: curl -fsS --max-time 25 https://colmeiasaudavel.onrender.com || echo "ping falhou (serviço pode estar a acordar)"
