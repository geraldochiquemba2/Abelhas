name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://colmeiasaudavel.onrender.com' }}
    steps:
      - name: Ping Render service
        run: curl -fsS --max-time 25 "$SITE_URL" || echo "ping falhou (serviço pode estar a acordar)"
